# fly launch 후 app 이름만 바꾸면 됨. secrets: fly secrets set OPENAI_API_KEY=... IP_SALT=...
app = "synth-persona-web"
primary_region = "nrt"

[build]

[env]
  PORT = "8787"
  DB_PATH = "/data/web-reports.db"

[[mounts]]
  source = "reports_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
